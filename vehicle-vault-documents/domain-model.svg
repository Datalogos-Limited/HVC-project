<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="975" viewBox="0 0 1240 975" role="img"><title>UML domain overview</title><desc>Class relationships for clients, compliance, vehicles, finance and documents. This represents the target domain; not all classes are implemented.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="35" y="42" font-family="Arial,sans-serif" font-size="25" fill="#0f172a" font-weight="bold">DREAM CAR BROKERS  /  UML DOMAIN OVERVIEW</text>
<text x="35" y="70" font-family="Arial,sans-serif" font-size="15" fill="#475569" font-weight="normal">Target schema · cross-vault relationships use opaque UUID references</text>
<rect x="440" y="105" width="360" height="146" rx="8" fill="white" stroke="#dbeafe" stroke-width="2"/>
<path d="M448,105 H792 Q800,105 800,113 V143 H440 V113 Q440,105 448,105" fill="#dbeafe"/>
<text x="454" y="130" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">ClientEntity</text>
<text x="454" y="167" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ id: UUID</text>
<text x="454" y="190" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ tenantId: UUID</text>
<text x="454" y="213" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ entityType: ClientType</text>
<text x="454" y="236" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ name, domicile: string</text>
<rect x="30" y="325" width="350" height="170" rx="8" fill="white" stroke="#fef3c7" stroke-width="2"/>
<path d="M38,325 H372 Q380,325 380,333 V363 H30 V333 Q30,325 38,325" fill="#fef3c7"/>
<text x="44" y="350" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">KYCCase</text>
<text x="44" y="387" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ id, clientId: UUID</text>
<text x="44" y="410" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ status: KYCState</text>
<text x="44" y="433" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ reviewDueAt: datetime</text>
<text x="44" y="456" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">0..* ScreeningResult</text>
<text x="44" y="479" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">0..* ComplianceDecision</text>
<rect x="445" y="325" width="350" height="170" rx="8" fill="white" stroke="#dcfce7" stroke-width="2"/>
<path d="M453,325 H787 Q795,325 795,333 V363 H445 V333 Q445,325 453,325" fill="#dcfce7"/>
<text x="459" y="350" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">Vehicle</text>
<text x="459" y="387" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ id, clientId: UUID</text>
<text x="459" y="410" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ chassisNumber: string</text>
<text x="459" y="433" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ titleStatus: TitleState</text>
<text x="459" y="456" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">0..* Valuation / OwnershipPeriod</text>
<text x="459" y="479" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">0..* Encumbrance</text>
<rect x="860" y="325" width="350" height="170" rx="8" fill="white" stroke="#ede9fe" stroke-width="2"/>
<path d="M868,325 H1202 Q1210,325 1210,333 V363 H860 V333 Q860,325 868,325" fill="#ede9fe"/>
<text x="874" y="350" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">Transaction</text>
<text x="874" y="387" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ id, clientId, assetId: UUID</text>
<text x="874" y="410" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ amountMinor: int64</text>
<text x="874" y="433" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ currency: ISO currency</text>
<text x="874" y="456" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ status: TransactionState</text>
<text x="874" y="479" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">0..* Payment / FXQuote / Hedge</text>
