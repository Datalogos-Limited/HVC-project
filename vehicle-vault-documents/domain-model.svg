<text x="35" y="856" font-family="Arial,sans-serif" font-size="15" fill="#0f172a" font-weight="bold">Implemented: client / vehicle core records, KYC drafts, transaction drafts and document lifecycle.</text>
<text x="35" y="884" font-family="Arial,sans-serif" font-size="15" fill="#475569" font-weight="normal">Planned: screening decisions, escrow, approvals, payment execution, FX/hedges and double-entry ledger.</text>
<text x="35" y="928" font-family="Arial,sans-serif" font-size="14" fill="#475569" font-weight="normal">Editable detailed UML: docs/uml/02-domain-model.puml  ·  Current persistence: scripts/schema.sql</text>
