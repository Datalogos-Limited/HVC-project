<text x="803" y="386" font-family="Arial,sans-serif" font-size="11" fill="#475569" font-weight="normal">asset</text>
<rect x="30" y="610" width="350" height="193" rx="8" fill="white" stroke="#f1f5f9" stroke-width="2"/>
<path d="M38,610 H372 Q380,610 380,618 V648 H30 V618 Q30,610 38,610" fill="#f1f5f9"/>
<text x="44" y="635" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">Document</text>
<text x="44" y="672" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ id, parentId: UUID</text>
<text x="44" y="695" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ tenantId, clientId: UUID</text>
<text x="44" y="718" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ vault: VaultType</text>
<text x="44" y="741" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ sha256: string</text>
<text x="44" y="764" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ generation: int64</text>
<text x="44" y="787" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ status: DocumentState</text>
<rect x="445" y="610" width="350" height="193" rx="8" fill="white" stroke="#ede9fe" stroke-width="2"/>
<path d="M453,610 H787 Q795,610 795,618 V648 H445 V618 Q445,610 453,610" fill="#ede9fe"/>
<text x="459" y="635" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">Escrow + Approval</text>
<text x="459" y="672" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ providerReference: string</text>
<text x="459" y="695" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ contractReference: string</text>
<text x="459" y="718" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ releaseState: EscrowState</text>
<text x="459" y="741" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ makerUid: string</text>
<text x="459" y="764" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ approverUid: string</text>
<text x="459" y="787" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">{ makerUid != approverUid }</text>
<rect x="860" y="610" width="350" height="193" rx="8" fill="white" stroke="#ede9fe" stroke-width="2"/>
<path d="M868,610 H1202 Q1210,610 1210,618 V648 H860 V618 Q860,610 868,610" fill="#ede9fe"/>
<text x="874" y="635" font-family="Arial,sans-serif" font-size="16" fill="#0f172a" font-weight="bold">Journal + Posting</text>
<text x="874" y="672" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ journalId, accountId: UUID</text>
<text x="874" y="695" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ signedMinor: int64</text>
<text x="874" y="718" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">+ currency: ISO currency</text>
<text x="874" y="741" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">{ sum = 0 per currency }</text>
<text x="874" y="764" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">Append-only posted entries</text>
<text x="874" y="787" font-family="Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="normal">Compensating reversal entries</text>
