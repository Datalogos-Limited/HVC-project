steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/dcb-vaults/api:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.scanner', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/dcb-vaults/scanner:$BUILD_ID', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/dcb-vaults/api:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/dcb-vaults/scanner:$BUILD_ID'
substitutions:
  _REGION: europe-west2
